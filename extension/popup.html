<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 260px;
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  background: #1a1a23;
  color: #e0e0e8;
  padding: 14px;
}
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #fff;
}
h2 { font-size: 15px; color: #fff; }
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #22222e;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}
.status-dot.active { background: #00d2a0; }
.status-dot.inactive { background: #ff5e7a; }
.btn {
  padding: 6px 14px;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-toggle {
  background: #6c5ce7;
  color: #fff;
}
.btn-toggle:hover { background: #7d6ff0; }
.stats {
  font-size: 11px;
  color: #8888a0;
  margin-bottom: 12px;
  line-height: 1.6;
}
.footer {
  font-size: 10px;
  color: #555;
  text-align: center;
  border-top: 1px solid #2a2a3a;
  padding-top: 10px;
  margin-top: 10px;
}
.btn-reset {
  background: transparent;
  color: #ff5e7a;
  border: 1px solid #ff5e7a;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
}
.btn-reset:hover { background: #ff5e7a22; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tab {
  flex: 1; padding: 6px 0; border: none; border-radius: 4px; cursor: pointer;
  background: #22222e; color: #8888a0; font-size: 12px; font-weight: 600;
}
.tab.active { background: #6c5ce7; color: #fff; }
.badge {
  display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px;
  background: #00d2a0; color: #06231b; font-size: 10px;
}
.badge.warn { background: #ff5e7a; color: #2a0a12; }
.tasks-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: #8888a0; margin-bottom: 6px;
}
.hidden { display: none !important; }
.media-head { font-size: 11px; color: #8888a0; margin-bottom: 6px; }
.ellipsis { display: block; max-width: 232px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-list { max-height: 220px; overflow-y: auto; }
.media-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 8px;
  border-radius: 5px; background: #22222e; margin-bottom: 6px;
}
.media-kind {
  font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px;
  background: #2d2440; color: #a29bfe; text-transform: uppercase;
}
.media-kind.video { background: #123a2e; color: #00d2a0; }
.media-kind.dash { background: #3a2410; color: #ffb45c; }
.media-kind.mse { background: #3a1720; color: #ff5e7a; }
.media-name { flex: 1; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-sub { font-size: 10px; color: #666680; }
.btn-dl { background: #00d2a0; color: #06231b; border: none; border-radius: 3px;
  font-size: 11px; font-weight: 700; padding: 4px 8px; cursor: pointer; }
.btn-dl.secondary { background: #6c5ce7; color: #fff; }
.btn-dl[disabled] { background: #2f2d3d; color: #55556a; cursor: not-allowed; }
.media-empty { font-size: 11px; color: #55556a; text-align: center; padding: 16px 0; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">&#11015;</div>
  <h2>SwiftDM 监控</h2>
</div>

<div class="stats">
  <div>下载中: <strong style="color:#a29bfe" id="liveActive">0</strong>
    · 速度: <span style="color:#00d2a0" id="liveSpeed">0 B/s</span>
    · 失败: <strong style="color:#ff5e7a" id="liveFailed">0</strong></div>
  <div>已捕获下载: <strong style="color:#a29bfe" id="sentCount">0</strong> 次</div>
  <div>服务器: <span style="color:#888" id="serverAddr">检测中...</span></div>
  <div style="margin-top:6px">
    <button class="btn-reset" id="resetBtn">清零计数</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tabCapture">捕获</button>
  <button class="tab" id="tabMedia">媒体 <span class="badge" id="mediaCount">0</span></button>
  <button class="tab" id="tabTasks">任务 <span class="badge warn hidden" id="taskFailCount">0</span></button>
</div>

<div id="panelCapture">
  <div class="status-row">
    <span>
      <span class="status-dot active" id="statusDot"></span>
      <span style="font-size:12px" id="statusText">已启用</span>
    </span>
    <button class="btn btn-toggle" id="toggleBtn">暂停</button>
  </div>
</div>

<div id="panelMedia" class="hidden">
  <div class="media-head">
    <span id="mediaPage" class="ellipsis">当前标签页</span>
  </div>
  <div class="media-list" id="mediaList">
    <div class="media-empty">未嗅探到媒体资源</div>
  </div>
</div>

<div id="panelTasks" class="hidden">
  <div class="tasks-head">
    <span>失败的下载任务（可一键重试）</span>
    <button class="btn-dl secondary" id="retryAllBtn" title="重试全部失败/已取消任务">全部重试</button>
  </div>
  <div class="media-list" id="taskList">
    <div class="media-empty">没有失败的下载任务</div>
  </div>
</div>

<div class="footer">
  确保 SwiftDM 桌面应用已启动
</div>

<script src="popup.js"></script>
</body>
</html>
