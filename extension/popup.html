<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
/* 主题调色板：与桌面端 THEMES / Web 端 :root 同值同名，
   popup.js 按应用主题切换 data-theme（跟随系统时回落系统偏好）。
   改值前先看 tests/test_theme_tokens.py 的登记表。 */
:root {
  --surface: #1a1a23;
  --surface2: #22222e;
  --surface3: #2b2b3d;
  --text: #e0e0e8;
  --text2: #8888a0;
  --faint: #555555;
  --border: #2a2a3a;
  --accent: #6c5ce7;
  --accent-hover: #7d6ff0;
  --accent2: #a29bfe;
  --accent-ink: #ffffff;
  --accent-soft: #2d2440;
  --green: #00d2a0;
  --green-soft: #123a2e;
  --red: #ff5e7a;
  --red-soft: #3a1720;
  --amber: #ffb45c;
  --amber-soft: #3a2410;
  --on-green: #06231b;
}
:root[data-theme="light"] {
  --surface: #ffffff;
  --surface2: #eceef6;
  --surface3: #dfe3ee;
  --text: #1b1e28;
  --text2: #5c6478;
  --faint: #9aa0b4;
  --border: #d8dce8;
  --accent: #6c5ce7;
  --accent-hover: #5b4bd6;
  --accent2: #8f80ff;
  --accent-ink: #ffffff;
  --accent-soft: #ece9ff;
  --green: #0a9d7c;
  --green-soft: #d7f4ec;
  --red: #df4660;
  --red-soft: #fbe4e8;
  --amber: #bd7410;
  --amber-soft: #fbeed8;
  --on-green: #06231b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 260px;
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--surface);
  color: var(--text);
  padding: 14px;
}
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--accent-ink);
}
h2 { font-size: 15px; color: var(--text); }
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface2);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}
.status-dot.active { background: var(--green); }
.status-dot.inactive { background: var(--red); }
.btn {
  padding: 6px 14px;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-toggle {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-toggle:hover { background: var(--accent-hover); }
.stats {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 12px;
  line-height: 1.6;
}
.footer {
  font-size: 10px;
  color: var(--faint);
  text-align: center;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 10px;
}
.btn-reset {
  background: transparent;
  color: var(--red);
  border: 1px solid var(--red);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
}
.btn-reset:hover { background: var(--red-soft); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tab {
  flex: 1; padding: 6px 0; border: none; border-radius: 4px; cursor: pointer;
  background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600;
}
.tab.active { background: var(--accent); color: var(--accent-ink); }
.badge {
  display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--green-soft); color: var(--green); font-size: 10px;
}
.badge.warn { background: var(--red-soft); color: var(--red); }
.tasks-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--text2); margin-bottom: 6px;
}
.hidden { display: none !important; }
.media-head { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
.ellipsis { display: block; max-width: 232px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-list { max-height: 220px; overflow-y: auto; }
.media-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 8px;
  border-radius: 5px; background: var(--surface2); margin-bottom: 6px;
}
.media-kind {
  font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px;
  background: var(--accent-soft); color: var(--accent2); text-transform: uppercase;
}
.media-kind.video { background: var(--green-soft); color: var(--green); }
.media-kind.dash { background: var(--amber-soft); color: var(--amber); }
.media-kind.mse { background: var(--red-soft); color: var(--red); }
.media-name { flex: 1; min-width: 0; font-size: 11px; overflow: hidden; }
/* 省略号得落在真正包着文字的那个元素上：文件名/错误信息都在子 div 里，
   写在 .media-name 上一个字符都不截；另外 flex 子项默认 min-width:auto，
   不显式归零的话长文件名会把整行连下载按钮一起顶出 260px 的弹窗。 */
.media-name > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-sub { font-size: 10px; color: var(--text2); }
.btn-dl { background: var(--green); color: var(--on-green); border: none; border-radius: 3px;
  font-size: 11px; font-weight: 700; padding: 4px 8px; cursor: pointer; }
.btn-dl.secondary { background: var(--accent); color: var(--accent-ink); }
.btn-dl[disabled] { background: var(--surface3); color: var(--faint); cursor: not-allowed; }
.media-empty { font-size: 11px; color: var(--text2); text-align: center; padding: 16px 0; }

/* 键盘焦点环：与 Web 端 :focus-visible 同一套做法（强调色描边 + 2px 偏移）。
   popup 里所有按钮都 border:none，之前键盘聚焦几乎看不出来。
   颜色只走令牌，切主题自动跟着变；鼠标点击不出现在画面上。 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
/* 选中的页签底色就是强调色，同色描边会糊在一起，换亮一号的 accent2 */
.tab.active:focus-visible { outline-color: var(--accent2); }
</style>
</head>
<body>
<div class="header">
  <div class="logo">&#11015;</div>
  <h2>SwiftDM 监控</h2>
</div>

<div class="stats">
  <div>下载中: <strong style="color:var(--accent2)" id="liveActive">0</strong>
    · 速度: <span style="color:var(--green)" id="liveSpeed">0 B/s</span>
    · 失败: <strong style="color:var(--red)" id="liveFailed">0</strong></div>
  <div>已捕获下载: <strong style="color:var(--accent2)" id="sentCount">0</strong> 次</div>
  <div>服务器: <span style="color:var(--text2)" id="serverAddr">检测中...</span></div>
  <div style="margin-top:6px">
    <button class="btn-reset" id="resetBtn">清零计数</button>
  </div>
</div>

<div class="tabs" role="tablist" aria-label="面板切换">
  <button class="tab active" id="tabCapture" role="tab" aria-selected="true" aria-controls="panelCapture">捕获</button>
  <button class="tab" id="tabMedia" role="tab" aria-selected="false" aria-controls="panelMedia">媒体 <span class="badge" id="mediaCount">0</span></button>
  <button class="tab" id="tabTasks" role="tab" aria-selected="false" aria-controls="panelTasks">任务 <span class="badge warn hidden" id="taskFailCount">0</span></button>
</div>

<div id="panelCapture" role="tabpanel" aria-labelledby="tabCapture">
  <div class="status-row">
    <span>
      <span class="status-dot active" id="statusDot"></span>
      <span style="font-size:12px" id="statusText">已启用</span>
    </span>
    <button class="btn btn-toggle" id="toggleBtn" aria-pressed="true">暂停</button>
  </div>
</div>

<div id="panelMedia" role="tabpanel" aria-labelledby="tabMedia" class="hidden">
  <div class="media-head">
    <span id="mediaPage" class="ellipsis">当前标签页</span>
  </div>
  <div class="media-list" id="mediaList">
    <div class="media-empty">未嗅探到媒体资源</div>
  </div>
</div>

<div id="panelTasks" role="tabpanel" aria-labelledby="tabTasks" class="hidden">
  <div class="tasks-head">
    <span>失败的下载任务（可一键重试）</span>
    <button class="btn-dl secondary" id="retryAllBtn" title="重试全部失败/已取消任务">全部重试</button>
  </div>
  <div class="media-list" id="taskList">
    <div class="media-empty">没有失败的下载任务</div>
  </div>
</div>

<div class="footer">
  确保 SwiftDM 桌面应用已启动
</div>

<script src="popup.js"></script>
</body>
</html>
